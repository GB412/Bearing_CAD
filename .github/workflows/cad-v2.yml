name: CAD-V2 contract and kernel gate
on:
  push:
    branches: [main, 'feature/cad-v2-*']
  pull_request:
    branches: [main]
jobs:
  cad-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment-v2.yml
          cache-environment: true
      - name: Run domain contracts and real OCCT STEP roundtrip
        shell: micromamba-shell {0}
        run: python -m unittest discover -s tests_v2 -p 'test_*.py' -v
