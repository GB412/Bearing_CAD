name: CAD-V2 contract and kernel gate
on:
  push:
    branches: [main, 'feature/cad-v2-*']
  pull_request:
    branches: [main]
jobs:
  cad-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment-v2.yml
          cache-environment: true
      - name: Run domain contracts and real OCCT STEP roundtrip
        shell: micromamba-shell {0}
        run: python -m unittest discover -s tests_v2 -p 'test_*.py' -v
      - name: Generate seven-case RoBAS migration geometry evidence
        shell: micromamba-shell {0}
        run: python -m bearing_cad.migration_baseline --output build/migration-07a
      - name: Publish migration evidence report (no STEP binaries)
        uses: actions/upload-artifact@v4
        with:
          name: 3d-mig-07a-robas-occt-evidence
          path: |
            build/migration-07a/comparison.json
            build/migration-07a/comparison.md
          if-no-files-found: error
  rolling-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate manifest and instance handling
        run: node --test rolling_manifest.test.js
      - name: Build both workbenches
        run: npm run build
      - name: Ensure V2 HTML is emitted
        run: test -s dist/rolling.html

  rolling-real-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment-v2.yml
          cache-environment: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Chromium for actual CAD browser E2E
        run: npx playwright install --with-deps chromium
      - name: Run actual browser→loopback Python CAD→OCCT→STEP/STL
        shell: micromamba-shell {0}
        run: npx playwright test --config playwright.rolling.real.config.js
