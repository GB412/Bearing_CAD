name: RoBAS 2D Python Unit Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  drawing-python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install isolated drawing dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest==8.3.5 ezdxf==1.4.2 Pillow==11.3.0
      - name: Run RoBAS 2D domain and DXF reference tests
        run: |
          python -m pytest -q tests_v2/test_robas_preflight.py tests_v2/test_robas_optimization.py tests_v2/test_robas_acb_optimization.py tests_v2/test_drawing_variables.py tests_v2/test_drawing_runner.py tests_v2/test_drawing_diagnostics.py tests_v2/test_drawing_consistency.py tests_v2/test_drawing_acceptance.py tests_v2/test_drawing_reference.py tests_v2/test_drawing_standards.py tests_v2/test_drawing_legacy_technical.py tests_v2/test_drawing_legacy_chamfer.py tests_v2/test_drawing_legacy_dimensions.py tests_v2/test_drawing_legacy_roller.py tests_v2/test_drawing_cli.py tests_v2/test_drawing_http.py tests_v2/test_drawing_legacy_ratings.py
