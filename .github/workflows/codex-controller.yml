name: Codex Controller
on:
  push:
    branches: [main, 'infra/codex-*', 'codex/**']
  pull_request:
    branches: [main]
jobs:
  controller-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Controller gates and queue schema
        run: python -m unittest discover -s tests -p test_codex_controller.py -v
      - name: Queue file validation
        run: python -c "from scripts.codex_controller import load_queue; print(len(load_queue()['tasks']))"
